<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .title { font-family: system-ui, sans-serif; font-weight: 800; fill: #fff; }
      .sub { font-family: system-ui, sans-serif; fill: #8b949e; }
      .feature { font-family: system-ui, sans-serif; fill: #c9d1d9; font-size: 14px; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .dot:nth-child(1) { animation-delay: 0s; }
      .dot:nth-child(2) { animation-delay: 0.3s; }
      .dot:nth-child(3) { animation-delay: 0.6s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .globe { animation: spin 10s linear infinite; transform-origin: 80px 100px; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .cat { animation: bob 3s ease-in-out infinite; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .fade1 { animation: fadeIn 3s ease-in-out infinite; }
      .fade2 { animation: fadeIn 3s ease-in-out infinite; animation-delay: 1s; }
      .fade3 { animation: fadeIn 3s ease-in-out infinite; animation-delay: 2s; }
      @keyframes fadeIn {
        0%, 30%, 100% { opacity: 0.4; }
        15% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="198" rx="15" fill="none" stroke="url(#accent)" stroke-width="2"/>

  <!-- Глобус -->
  <g class="globe">
    <circle cx="80" cy="100" r="35" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
    <ellipse cx="80" cy="100" rx="35" ry="12" fill="none" stroke="#4a9eff" stroke-width="1"/>
    <ellipse cx="80" cy="100" rx="35" ry="24" fill="none" stroke="#4a9eff" stroke-width="1"/>
    <ellipse cx="80" cy="100" rx="12" ry="35" fill="none" stroke="#4a9eff" stroke-width="1"/>
    <ellipse cx="80" cy="100" rx="24" ry="35" fill="none" stroke="#4a9eff" stroke-width="1"/>
  </g>

  <!-- Кот -->
  <text x="80" y="175" text-anchor="middle" font-size="28" class="cat">🐱</text>

  <!-- Заголовок -->
  <text x="150" y="70" font-size="42" class="title">Catai</text>
  <text x="150" y="95" font-size="15" class="sub">Локальный ИИ-помощник с интернет-поиском</text>

  <!-- Функции -->
  <g transform="translate(150, 125)">
    <circle cx="5" cy="0" r="4" fill="#4a9eff" class="dot"/>
    <text x="20" y="5" class="feature fade1">🧠 Локальная база знаний</text>

    <circle cx="5" cy="25" r="4" fill="#a855f7" class="dot"/>
    <text x="20" y="30" class="feature fade2">🌐 Wikipedia и DuckDuckGo</text>

    <circle cx="5" cy="50" r="4" fill="#4a9eff" class="dot"/>
    <text x="20" y="55" class="feature fade3">💬 Диалог и история</text>
  </g>

  <!-- Правый блок -->
  <g transform="translate(620, 70)">
    <text x="0" y="0" font-size="12" class="sub">Windows 10/11</text>
    <text x="0" y="20" font-size="12" class="sub">MIT License</text>
    <text x="0" y="40" font-size="12" class="sub">winget install</text>
    <text x="0" y="60" font-size="11" fill="#4a9eff" font-family="monospace">Kirill638849776.CatAI</text>
  </g>
</svg>
